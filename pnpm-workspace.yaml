packages:
  - apps/*
  - packages/*

overrides:
  shell-quote: '>=1.8.4'
  tar: '>=7.5.19'
  # Patch deprecated SDK dependencies without changing the Expo SDK.
  '@ungap/structured-clone@1.3.0': '^1.3.1'
  '@xmldom/xmldom@<0.8.15': '^0.8.15'
  # Xcode only uses uuid.v4(); v11 retains that CommonJS API.
  'xcode@3.0.1>uuid': '^11.1.0'

# Dependency integrity and release cooldown.
blockExoticSubdeps: true
minimumReleaseAge: 2880
verifyStoreIntegrity: true
engineStrict: true

frozenLockfile: false

allowBuilds:
  unrs-resolver: true

nodeLinker: hoisted

patchedDependencies:
  react-native-zip-archive@7.1.0: apps/mobile/patches/react-native-zip-archive@7.1.0.patch
